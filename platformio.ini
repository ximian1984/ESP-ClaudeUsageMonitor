; LILYGO T-Dongle-S3 — Claude Usage Monitor
; Platform + board: a hivatalos LilyGO repo platformio.ini / boards/dongles3.json alapjan
; (github.com/Xinyuan-LilyGO/T-Dongle-S3 @ bb76546, 2026-09-15).

[platformio]
default_envs = t-dongle-s3

[env:t-dongle-s3]
platform = espressif32@6.12.0
framework = arduino
board = dongles3
board_build.partitions = default_16MB.csv
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@^7
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; --- TFT_eSPI: a LilyGO Setup209_LilyGo_T_Dongle_S3.h ertekei, build-flagkent ---
    -DUSER_SETUP_LOADED=1
    ; Nincs erinto (TOUCH_CS) -> a TFT_eSPI "TOUCH_CS pin not defined" #warning-ja zaj.
    ; A konyvtar sajat kapcsoloja (TFT_eSPI User_Setup.h:15, TFT_eSPI.h:972).
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    ; ⛔ KOTELEZO ESP32-S3 + Arduino-ESP32 2.0.17 alatt. Nelkule a TFT_eSPI SPI_PORT = FSPI = 0
    ; (esp32-hal-spi.h:29), a regiszter-cim REG_SPI_BASE(0) = 0 (IDF soc/esp32s3/.../soc.h:122)
    ; -> tft.init() a 0-s cimre ir -> ures kijelzo, lefagyott lapka (vason mert 2026-09-17, e flaggel mukodik; PLAN 2.11).
    ; USE_FSPI_PORT: SPI_PORT = 2 -> DR_REG_SPI2_BASE, es SPIClass(FSPI) ugyanarra a GPSPI2-re (TFT_eSPI_ESP32_S3.h:75, .c:17).
    -DUSE_FSPI_PORT=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000

; ---------------------------------------------------------------------------------------------------------
; ESP32-2432S028R "Cheap Yellow Display" (CYD) — klasszikus ESP32-WROOM-32, 4 MB flash, 2,8" 240x320 TFT.
; Forrasok (PLAN.md 2.15): witnessmenow/ESP32-Cheap-Yellow-Display @ 0564a14 (DisplayConfig/User_Setup.h,
; PINS.md), rzeldent/platformio-espressif32-sunton @ 0d9a9b1a (esp32-2432S028R*.json).
; ⚠ FIZIKAI CYD-N NEM MERT: tiszta build van, a kijelzo-driver / szinsorrend / invertalas / forgatas nyitott.
; ---------------------------------------------------------------------------------------------------------
[cyd_common]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
; 4 MB flash: a default.csv app-particioja (0x140000) 91,2 %-ig telt (mert, 1 195 081 B) -> min_spiffs.csv:
; app 0x1E0000 (1,875 MB) x2 (OTA-alak marad), az NVS ugyanott, ugyanakkora (0x9000, 0x5000), mint a dongle-on.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@^7
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_CYD=1
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    ; ⛔ A dongle USE_FSPI_PORT-ja ESP32-S3-specifikus, itt NEM kell. A CYD kijelzoje a HSPI-n van (PINS.md
    ; "Display: Uses the HSPI"; User_Setup.h:371 USE_HSPI_PORT) -> TFT_eSPI_ESP32.c:12 SPIClass(HSPI).
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; User_Setup.h:206-212. RST: a lap RST-jere kotve (-1). A hattervilagitast (IO21) a config.h kezeli.
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    ; A nativ 320x240-es elrendezes (display_cyd.cpp) nagyobb fontjai: 4 = 26 px, 6 = 48 px (csak szamjegyek).
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; A referencia 55 MHz-et ir (User_Setup.h:359), de az Arduino-core csak az ALATTA levo 80 MHz/n osztot
    ; fogadja el (esp32-hal-spi.c spiFrequencyToClockDiv, "calFreq < freq") -> az valojaban 40 MHz. Kiirjuk.
    -DSPI_FREQUENCY=40000000

; Az eredeti, egy (micro-USB) csatlakozos CYD: ILI9341. Mindharom forras egyezik (witnessmenow User_Setup.h:46
; ILI9341_2_DRIVER; rzeldent esp32-2432S028R.json DISPLAY_ILI9341_SPI, BGR; RNT CYD-cikk). A szinsorrend a
; TFT_eSPI ILI9341-alapja: BGR (TFT_Drivers/ILI9341_Defines.h:72) — egyezik a rzeldent COLOR_SPACE_BGR-rel.
[env:esp32-2432s028r]
extends = cyd_common
build_flags =
    ${cyd_common.build_flags}
    -DILI9341_2_DRIVER=1
    ; Az Rv2-nek nevezett, csak USB-C-s lapnak sajat ILI9341-initje van, benne INVON (0x21): rzeldent
    ; esp32-2432S028Rv2.json. Ha ezen a buildon a szinek invertaltak: -DTFT_INVERSION_ON=1 (TFT_eSPI.cpp:774-776).

; A ket csatlakozos (USB-C + micro-USB) CYD — witnessmenow "CYD2USB" / rzeldent "Rv3": ST7789.
; A beallitas a witnessmenow DisplayConfig/CYD2USB/User_Setup.h-bol: ST7789_DRIVER, TFT_RGB_ORDER TFT_BGR,
; TFT_INVERSION_OFF (a TFT_eSPI ST7789-initje INVON-t kuld, ST7789_Init.h:102; az INVOFF ezt vonja vissza,
; TFT_eSPI.cpp:778-780). Az SPI-mod a TFT_eSPI-ben ST7789-nel MODE3 (TFT_eSPI.h:131-133) — a rzeldent Rv3 is ezt irja.
; ⚠ [vason merendo] a szinsorrend: a witnessmenow BGR-t mond, a rzeldent esp32-2432S028Rv3.json
; ST7789_DEV_CONFIG_COLOR_SPACE=ESP_LCD_COLOR_SPACE_RGB-t. Ha a piros es a kek fel van cserelve:
; -DTFT_RGB_ORDER=TFT_RGB. Ha a szinek invertaltak: -DTFT_INVERSION_ON=1 a TFT_INVERSION_OFF helyett.
[env:esp32-2432s028r-st7789]
extends = cyd_common
build_flags =
    ${cyd_common.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
